version: 2

models:
  - name: dim_locations
    description: "Conformed geographic dimension table tracking US States and Counties based on FIPS codes."
    columns:
      - name: location_key
        description: "Surrogate primary key generated by hashing state_code and county_code."
        tests:
          - unique
          - not_null

      - name: state_code
        description: "Two-digit FIPS state code identifier."
        tests:
          - not_null

      - name: county_code
        description: "Three-digit FIPS county code identifier."
        tests:
          - not_null

  - name: dim_dates
    description: "Time dimension table representing the rolling coverage window of the US Census ACS 5-Year dataset."
    columns:
      - name: date_key
        description: "Primary key representing the data ingestion calendar year."
        tests:
          - unique
          - not_null

  - name: fact_county_metrics
    description: "Centralized fact table containing housing, economic, demographic, and computed social rates at the County grain."
    columns:
      - name: fact_key
        description: "Surrogate primary key identifying a unique county record for a specific snapshot year."
        tests:
          - unique
          - not_null

      - name: location_key
        description: "Foreign key referencing dim_locations."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_key

      - name: date_key
        description: "Foreign key referencing dim_dates."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: total_population
        description: "Total population count of the given county geography."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: bachelors_degree_rate
        description: "Calculated percentage of the population holding a Bachelor's degree or higher."
        
      - name: poverty_rate
        description: "Calculated percentage of the population living below the federal poverty line."

      - name: high_school_grad_rate
        description: "Calculated percentage of the population whose highest educational attainment is a high school diploma."